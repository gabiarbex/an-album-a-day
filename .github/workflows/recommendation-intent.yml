name: Recommendation intent regression

on:
  push:
    paths:
      - 'intent-core.js'
      - 'selector.js'
      - 'tests/retrieval-intent.test.cjs'
      - 'tests/intent-100.test.cjs'
      - 'retrieval-fusion.js'
      - 'scripts/experiment-cross-encoder.py'
      - 'api/_student-ranker.js'
      - 'scripts/train-student.mjs'
      - 'tests/student-ranker.test.mjs'
      - 'tests/retrieval-fusion.test.cjs'
      - 'tests/listening-goal.test.cjs'
      - 'api/_taste-policy.js'
      - 'api/_taste-store.js'
      - 'tests/taste-policy.test.mjs'
      - 'benchmarks/emotional-goals.json'
      - 'tests/ranking-contract.test.mjs'
      - 'benchmarks/intent-100.json'
      - 'api/_ranking-core.js'
      - '.github/workflows/recommendation-intent.yml'
  pull_request:
    paths:
      - 'intent-core.js'
      - 'selector.js'
      - 'tests/retrieval-intent.test.cjs'
      - 'tests/intent-100.test.cjs'
      - 'retrieval-fusion.js'
      - 'scripts/experiment-cross-encoder.py'
      - 'api/_student-ranker.js'
      - 'scripts/train-student.mjs'
      - 'tests/student-ranker.test.mjs'
      - 'tests/retrieval-fusion.test.cjs'
      - 'tests/listening-goal.test.cjs'
      - 'api/_taste-policy.js'
      - 'api/_taste-store.js'
      - 'tests/taste-policy.test.mjs'
      - 'benchmarks/emotional-goals.json'
      - 'tests/ranking-contract.test.mjs'
      - 'benchmarks/intent-100.json'
      - 'api/_ranking-core.js'
      - '.github/workflows/recommendation-intent.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check intent-core.js
          node --check selector.js
          node --check retrieval-fusion.js
          node --check api/_student-ranker.js
          node --check scripts/train-student.mjs
      - name: Validate shadow ML experiment without model downloads
        run: |
          python3 -m py_compile scripts/experiment-cross-encoder.py
          python3 scripts/experiment-cross-encoder.py --observations benchmarks/production-top1-observed.json
      - name: Check exclusions and multilingual requests
        run: |
          node tests/retrieval-intent.test.cjs
          node tests/intent-100.test.cjs
          node tests/ranking-contract.test.mjs
          node tests/retrieval-fusion.test.cjs
          node tests/listening-goal.test.cjs
          node tests/taste-policy.test.mjs
          node tests/student-ranker.test.mjs
