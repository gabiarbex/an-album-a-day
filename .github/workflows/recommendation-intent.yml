name: Recommendation intent regression

on:
  push:
    paths:
      - 'intent-core.js'
      - 'album-locale.js'
      - 'geo-catalog.js'
      - 'data/geography/**'
      - 'tests/global-requests.test.cjs'
      - 'tests/geo-catalog.test.cjs'
      - 'tests/geography-ranking.test.mjs'
      - 'api/_embedding.js'
      - 'selector.js'
      - 'tests/retrieval-intent.test.cjs'
      - 'tests/intent-100.test.cjs'
      - 'retrieval-fusion.js'
      - 'scripts/experiment-cross-encoder.py'
      - 'api/_student-ranker.js'
      - 'scripts/train-student.mjs'
      - 'tests/student-ranker.test.mjs'
      - 'scripts/evaluate-student-human.mjs'
      - 'scripts/select-active-review.mjs'
      - 'tests/active-review.test.mjs'
      - 'scripts/score-teacher-onnx.mjs'
      - 'benchmarks/review.html'
      - 'benchmarks/ml-stress-prompts.json'
      - 'tests/student-human-eval.test.mjs'
      - 'tests/retrieval-fusion.test.cjs'
      - 'tests/listening-goal.test.cjs'
      - 'api/_taste-policy.js'
      - 'api/_taste-store.js'
      - 'tests/taste-policy.test.mjs'
      - 'benchmarks/emotional-goals.json'
      - 'tests/ranking-contract.test.mjs'
      - 'benchmarks/intent-100.json'
      - 'api/_ranking-core.js'
      - '.github/workflows/recommendation-intent.yml'
  pull_request:
    paths:
      - 'intent-core.js'
      - 'album-locale.js'
      - 'geo-catalog.js'
      - 'data/geography/**'
      - 'tests/global-requests.test.cjs'
      - 'tests/geo-catalog.test.cjs'
      - 'tests/geography-ranking.test.mjs'
      - 'api/_embedding.js'
      - 'selector.js'
      - 'tests/retrieval-intent.test.cjs'
      - 'tests/intent-100.test.cjs'
      - 'retrieval-fusion.js'
      - 'scripts/experiment-cross-encoder.py'
      - 'api/_student-ranker.js'
      - 'scripts/train-student.mjs'
      - 'tests/student-ranker.test.mjs'
      - 'scripts/evaluate-student-human.mjs'
      - 'scripts/select-active-review.mjs'
      - 'tests/active-review.test.mjs'
      - 'scripts/score-teacher-onnx.mjs'
      - 'benchmarks/review.html'
      - 'benchmarks/ml-stress-prompts.json'
      - 'tests/student-human-eval.test.mjs'
      - 'tests/retrieval-fusion.test.cjs'
      - 'tests/listening-goal.test.cjs'
      - 'api/_taste-policy.js'
      - 'api/_taste-store.js'
      - 'tests/taste-policy.test.mjs'
      - 'benchmarks/emotional-goals.json'
      - 'tests/ranking-contract.test.mjs'
      - 'benchmarks/intent-100.json'
      - 'api/_ranking-core.js'
      - '.github/workflows/recommendation-intent.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check intent-core.js
          node --check album-locale.js
          node --check geo-catalog.js
          node --check api/_ranking-core.js
          node --check api/_embedding.js
          node --check selector.js
          node --check retrieval-fusion.js
          node --check api/_student-ranker.js
          node --check scripts/train-student.mjs
          node --check scripts/evaluate-student-human.mjs
          node --check scripts/select-active-review.mjs
          node --check scripts/score-teacher-onnx.mjs
      - name: Validate shadow ML experiment without model downloads
        run: |
          python3 -m py_compile scripts/experiment-cross-encoder.py
          python3 scripts/experiment-cross-encoder.py --observations benchmarks/production-top1-observed.json
          python3 scripts/experiment-cross-encoder.py --observations benchmarks/production-top1-observed.json --pairs-output /tmp/album-pairs.json
          node scripts/score-teacher-onnx.mjs --pairs /tmp/album-pairs.json
      - name: Check exclusions and multilingual requests
        run: |
          node tests/retrieval-intent.test.cjs
          node tests/intent-100.test.cjs
          node tests/ranking-contract.test.mjs
          node tests/retrieval-fusion.test.cjs
          node tests/listening-goal.test.cjs
          node tests/taste-policy.test.mjs
          node tests/global-requests.test.cjs
          node tests/geo-catalog.test.cjs
          node tests/geography-ranking.test.mjs
          node tests/student-ranker.test.mjs
          node tests/student-human-eval.test.mjs
          node tests/active-review.test.mjs
