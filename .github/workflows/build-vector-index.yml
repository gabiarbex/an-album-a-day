name: Build album vector index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_vector_index.py"
      - ".github/workflows/build-vector-index.yml"
      - "data/catalog/**"

permissions:
  contents: write

concurrency:
  group: album-vector-index
  cancel-in-progress: true

jobs:
  build-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install embedding dependencies
        run: python -m pip install --upgrade numpy sentence-transformers

      - name: Build 100k MiniLM vector index
        run: python scripts/build_vector_index.py

      - name: Show generated size
        run: du -sh data/vectors/v3 && find data/vectors/v3 -type f | wc -l

      - name: Commit vector shards
        run: |
          git config user.name "album-a-day vector bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vectors/v3
          if git diff --cached --quiet; then
            echo "Vector index already up to date."
            exit 0
          fi
          git commit -m "Build 100k MiniLM album vector index"
          git pull --rebase origin main
          git push origin HEAD:main
