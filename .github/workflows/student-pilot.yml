name: Offline multilingual teacher-student pilot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/student-pilot.yml'

permissions:
  contents: read

jobs:
  offline-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline ONNX inference library
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.8.1
      - name: Export actual public 14-query candidate pairs
        run: |
          mkdir -p offline-artifacts
          python3 scripts/experiment-cross-encoder.py --observations benchmarks/production-top1-observed.json --pairs-output offline-artifacts/teacher-pairs.json
          node scripts/score-teacher-onnx.mjs --pairs offline-artifacts/teacher-pairs.json
      - name: Score with multilingual quantized cross encoder (CPU)
        run: |
          node scripts/score-teacher-onnx.mjs --pairs offline-artifacts/teacher-pairs.json --score --batch-size 8 --output offline-artifacts/teacher-scored.json
      - name: Train strictly non-production student on teacher labels
        run: |
          node scripts/train-student.mjs --teacher offline-artifacts/teacher-scored.json --output offline-artifacts/student-pilot.json --allow-small-experiment
      - name: Preserve experiment data and evaluation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albumaday-multilingual-teacher-pilot
          path: offline-artifacts/
          retention-days: 30
          if-no-files-found: warn
