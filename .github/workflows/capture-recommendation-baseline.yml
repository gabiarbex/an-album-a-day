name: Capture production recommendation baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture-production-baseline.mjs'
      - 'scripts/analyze-production-baseline.mjs'
      - 'scripts/compare-production-baselines.mjs'
      - 'scripts/smoke-mobile.mjs'
      - 'editorial.css'
      - 'style.css'
      - 'api/recommend.js'
      - 'api/_ranking-core.js'
      - 'api/_embedding.js'
      - 'selector.js'
      - 'index.html'
      - '.github/workflows/capture-recommendation-baseline.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture eight live production recommendations
        run: node scripts/capture-production-baseline.mjs
        env:
          BASELINE_URL: https://gabiarbex.github.io/an-album-a-day/
      - name: Check phone-size layout, picker and save controls
        if: always()
        run: node scripts/smoke-mobile.mjs
        env:
          BASELINE_URL: https://gabiarbex.github.io/an-album-a-day/
      - name: Report observable genre, compilation and explanation metrics
        if: always()
        run: |
          if [ -f baseline-results/production-top1.json ]; then
            node scripts/analyze-production-baseline.mjs baseline-results/production-top1.json > baseline-results/metadata-report.json
            cat baseline-results/metadata-report.json
          fi
      - name: Compare with frozen v4 reference
        if: always()
        run: |
          if [ -f baseline-results/production-top1.json ]; then
            node scripts/compare-production-baselines.mjs benchmarks/2026-11-07-v4-reference.json baseline-results/production-top1.json > baseline-results/version-comparison.json
            cat baseline-results/version-comparison.json
          fi
      - name: Publish public baseline observations
        if: always()
        run: |
          if [ ! -f baseline-results/production-top1.json ]; then
            echo 'No results file to publish.'
            exit 0
          fi
          mkdir -p benchmarks
          cp baseline-results/production-top1.json benchmarks/production-top1-observed.json
          if [ -f baseline-results/mobile-smoke.json ]; then
            cp baseline-results/mobile-smoke.json benchmarks/mobile-smoke-latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/production-top1-observed.json
          if [ -f benchmarks/mobile-smoke-latest.json ]; then git add benchmarks/mobile-smoke-latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record actual production top-one benchmark observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-production-top1
          path: baseline-results/
          if-no-files-found: warn
          retention-days: 30
