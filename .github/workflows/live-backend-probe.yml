name: Live neural backend probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/live_backend_probe.py"
      - "scripts/retrieval_quality_probe.py"
      - ".github/workflows/live-backend-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed recommender behavior
        run: python scripts/live_backend_probe.py
      - name: Audit live retrieval quality
        run: python scripts/retrieval_quality_probe.py
