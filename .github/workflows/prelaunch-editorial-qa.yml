name: Pre-launch editorial browser QA

on:
  push:
    paths:
      - '.github/workflows/prelaunch-editorial-qa.yml'
      - 'scripts/prelaunch-editorial-qa.mjs'
      - 'theme.css'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: album-editorial-release-qa
  cancel-in-progress: true

jobs:
  visual-and-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Wait for updated public editorial assets
        run: |
          ready=0
          for n in $(seq 1 30); do
            if curl -fsSL https://gabiarbex.github.io/an-album-a-day/ |
              grep -q 'theme.css?v=listening-desk-04'; then
              ready=1
              break
            fi
            sleep 10
          done
          [ "$ready" = 1 ] || { echo "The new editorial page is not deployed."; exit 1; }
      - name: Validate JS syntax before browser testing
        run: node --check scripts/prelaunch-editorial-qa.mjs
      - name: Check desktop mobile narrow-screen and real picker UX
        run: node scripts/prelaunch-editorial-qa.mjs
      - name: Attach screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-prelaunch-screenshots
          path: baseline-results/editorial/
          retention-days: 21
          if-no-files-found: warn
