name: Build 100k album catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-catalog.yml"

permissions:
  contents: write

concurrency:
  group: album-catalog-build
  cancel-in-progress: true

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve latest MusicBrainz JSON dump
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          DUMP_ID="$(curl -fsSL https://data.metabrainz.org/pub/musicbrainz/data/json-dumps/LATEST | tr -d '\r\n')"
          test -n "$DUMP_ID"
          echo "dump_id=$DUMP_ID" >> "$GITHUB_OUTPUT"
          echo "Using MusicBrainz JSON dump $DUMP_ID"

      - name: Download release-group dump
        shell: bash
        run: |
          set -euo pipefail
          URL="https://data.metabrainz.org/pub/musicbrainz/data/json-dumps/${{ steps.dump.outputs.dump_id }}/release-group.tar.xz"
          curl -fL --retry 5 --retry-delay 5 --continue-at - -o release-group.tar.xz "$URL"
          test -s release-group.tar.xz
          ls -lh release-group.tar.xz

      - name: Build global catalog while preserving editorial base
        run: |
          python scripts/build_catalog_from_dump.py \
            --dump release-group.tar.xz \
            --base-catalog data/albums.json \
            --target 100000 \
            --output data/catalog-expanded.json

      - name: Split catalog into browser-friendly shards
        run: |
          python scripts/shard_catalog.py \
            --input data/catalog-expanded.json \
            --out-dir data/catalog \
            --shard-size 1000

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("data/catalog")
          manifest=json.loads((root/"manifest.json").read_text())
          lookup=json.loads((root/"lookup.json").read_text())
          shards=manifest["shards"]
          total=manifest["total_albums"]
          base_count=manifest["base_count"]

          assert total == 100000, f"Expected 100,000 albums, got {total:,}"
          assert base_count >= 9500, f"Editorial base unexpectedly small: {base_count:,}"
          assert base_count + sum(s["count"] for s in shards) == total
          assert len(lookup) == total, f"Lookup index mismatch: {len(lookup):,}"
          assert (root/manifest["base_file"]).exists()
          assert all((root/s["file"]).exists() for s in shards)

          original=0
          base_enriched=0
          with_genre=0
          with_mood=0
          with_energy=0
          with_duration=0
          ids=set()
          files=[manifest["base_file"]]+[s["file"] for s in shards]
          for filename in files:
              rows=json.loads((root/filename).read_text())["albums"]
              for album in rows:
                  lid=album.get("lookup_id")
                  assert lid and lid not in ids, f"Duplicate/missing lookup id: {lid}"
                  ids.add(lid)
                  original += album.get("_catalog_source") == "original"
                  base_enriched += album.get("_enriched_from") == "musicbrainz_dump"
                  with_genre += bool(album.get("genres"))
                  with_mood += bool(album.get("moods"))
                  with_energy += album.get("energy_level") is not None
                  with_duration += album.get("length_min") is not None

          assert len(ids)==total
          assert original==base_count, f"Original count mismatch: {original:,} vs {base_count:,}"
          print(f"Catalog: {total:,}")
          print(f"Preserved editorial base: {original:,}")
          print(f"Editorial base enriched from MusicBrainz: {base_enriched:,}")
          print(f"Expansion shards: {len(shards)}")
          print(f"Genre coverage: {with_genre/total:.1%}")
          print(f"Mood-tag coverage: {with_mood/total:.1%}")
          print(f"Energy-tag coverage: {with_energy/total:.1%}")
          print(f"Duration coverage: {with_duration/total:.1%}")
          PY
      - name: Remove build-only files
        run: rm -f release-group.tar.xz data/catalog-expanded.json data/catalog-checkpoint.json

      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi

          git commit -m "Build verified sharded 100k album discovery catalog"
          git pull --rebase origin main
          git push origin HEAD:main
